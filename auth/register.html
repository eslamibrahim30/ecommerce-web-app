<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - My Store</title>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/shared/auth.js" defer></script>
</head>

<body>
  <div class="container flex items-center justify-center" style="min-height: 80vh;">
    <form id="registerform">
      <h2>Register</h2>

      <div class="form-group">
        <label for="registeremail">E-mail</label>
        <input type="email" name="email" id="registeremail" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="pass">Password</label>
        <input type="password" name="pass" id="pass" placeholder="Password" required>
      </div>

      <div class="form-group">
        <label for="repeatpass">Repeat Password</label>
        <input type="password" name="repeatpass" id="repeatpass" placeholder="Repeat Password" required>
      </div>

      <button id="register" type="submit" class="mt-2 text-center">Register</button>
      <p id="error" class="error-message mt-2" style="display: none;"></p>

      <div class="text-center mt-4">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </form>
  </div>
</body>

</html>
