<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - My Store</title>
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/shared/auth.js" defer></script>
</head>

<body>
  <div class="container flex items-center justify-center" style="min-height: 80vh;">
    <form id="loginform">
      <h2>Login</h2>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="pass">Password</label>
        <input type="password" name="pass" id="pass" placeholder="Password" required>
      </div>

      <button id="login" type="submit" class="mt-2 text-center">Login</button>
      <p id="error" class="error-message mt-2" style="display: none;"></p>

      <div class="text-center mt-4">
        Don't have an account? <a href="auth/register.html">Register here</a>
      </div>
    </form>
  </div>
</body>

</html>
