<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Store - Home</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body>
  <nav>
    <a href="index.html" class="nav-brand">My Store</a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="admin.html" id="admin-link" class="nav-link" style="display: none;">Admin</a>
      <a href="wishlist.html" class="nav-link">Wishlist ❤️</a>
      <div id="auth-section" class="flex items-center gap-2">
        <span id="user-email" class="nav-link" style="font-weight: 700;"></span>
        <button id="logout-btn" onclick="logout()" class="secondary"
          style="display: none; padding: 0.5rem 1rem;">Logout</button>
        <a href="login.html" id="login-nav-link" class="nav-link" style="display: none;">Login</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="card mb-4">
      <div class="flex items-center gap-2">
        <input type="text" id="searchInput" placeholder="Search products..." style="flex: 1;">
        <select id="categoryFilter">
          <option value="all">All Categories</option>
          <option value="Electronics">Electronics</option>
          <option value="Clothes">Clothes</option>
          <option value="Books">Books</option>
        </select>
      </div>
    </div>

    <div id="productsContainer" class="products-grid"></div>
  </div>

  <script src="/js/customer/products.js"></script>
  <script type="module" src="/js/shared/auth.js" defer></script>

</body>

</html>
